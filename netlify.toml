[build]
  command = "node build.mjs"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
\n[[headers]]\n  for = "/assets/content-data.js"\n  [headers.values]\n    Cache-Control = "no-cache, must-revalidate"\n\n[[headers]]\n  for = "/*.html"\n  [headers.values]\n    Cache-Control = "no-cache, must-revalidate"\n\n[[headers]]\n  for = "/"\n  [headers.values]\n    Cache-Control = "no-cache, must-revalidate"\n