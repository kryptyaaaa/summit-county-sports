name: Publish Summit County Sports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build all published galleries
        run: |
          node build.mjs
          touch _site/.nojekyll

      - name: Check media integrity
        run: |
          test -s _site/assets/content-data.js
          node --check app.js
          grep -q 'hoban-vs-walsh-holy-war-student-section' _site/portfolio.html
          grep -q 'Dd0An-_gnh-' _site/portfolio.html
          grep -q '1KCScHyQgxnZdm4hFObMq3uYw0f5TxS9Z' _site/portfolio.html
          grep -q 'drive.google.com/file/d/' _site/app.js
          grep -q 'AL3A1394.jpg' _site/portfolio.html
          grep -q 'feature-video-artwork' _site/app.js
          # The Football card and photo gallery must be present in the actual HTML served to visitors.
          grep -q 'hoban-vs-nfl-academy-football-2026' _site/portfolio.html
          grep -q '"published": true' _site/portfolio.html
          ! grep -q 'src="assets/content-data.js' _site/portfolio.html
          test "$(find _site/assets/uploads/hoban-vs-nfl-academy-football-2026 -maxdepth 1 -name '*.jpg' | wc -l)" -ge 30
          test "$(find _site/assets/uploads/byron-nelson-volleyball-media-day -maxdepth 1 -name '*.jpg' | wc -l)" -eq 111
          test "$(find _site/assets/uploads/jackson-volleyball-media-day -maxdepth 1 -name '*.jpg' | wc -l)" -eq 24
          test "$(find _site/assets/uploads/wadsworth-girls-volleyball -maxdepth 1 -name '*.jpg' | wc -l)" -eq 41

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
