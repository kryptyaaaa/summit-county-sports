name: Publish Summit County Sports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build all published galleries
        run: |
          node build.mjs
          touch _site/.nojekyll

      - name: Check media integrity
        run: |
          test -s _site/assets/content-data.js
          test "$(find _site/assets/uploads/byron-nelson-volleyball-media-day -maxdepth 1 -name '*.jpg' | wc -l)" -eq 111
          test "$(find _site/assets/uploads/jackson-volleyball-media-day -maxdepth 1 -name '*.jpg' | wc -l)" -eq 24
          test "$(find _site/assets/uploads/wadsworth-girls-volleyball -maxdepth 1 -name '*.jpg' | wc -l)" -eq 41

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
