name: Publish Summit County Sports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build all published galleries
        run: |
          node build.mjs
          touch _site/.nojekyll

      - name: Check published pages and uploaded media
        run: |
          test -s _site/assets/content-data.js
          node --check app.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const slug = 'ellet-vs-garfield-boys-soccer';
          const page = fs.readFileSync('_site/portfolio.html', 'utf8');
          const detail = fs.readFileSync('_site/event.html', 'utf8');
          const event = JSON.parse(fs.readFileSync('content/events/' + slug + '.json', 'utf8'));
          const gallery = [...new Set(event.gallery)];
          if (event.category !== 'Soccer' || !event.published) throw Error('Soccer event missing or unpublished');
          if (gallery.length !== 26) throw Error('Expected 26 Ellet vs Garfield photos; found ' + gallery.length);
          for (const photo of gallery) {
            if (!fs.existsSync('_site/' + photo)) throw Error('Gallery photo missing from published site: ' + photo);
          }
          if (!page.includes('data-category="Soccer"')) throw Error('Soccer filter missing from published portfolio');
          if (!page.includes(slug) || !detail.includes(slug)) throw Error('Soccer gallery missing from the published page data');
          if (!fs.readFileSync('_site/index.html', 'utf8').includes('category=Soccer')) throw Error('Homepage Soccer navigation missing');
          console.log('Verified Soccer category and all ' + gallery.length + ' website photo files');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
